
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="dashboard">
        <header>
            <p class="eyebrow">WEATHER FORECAST</p>
            <h1>Weather Dashboard</h1>
            <p class="subtitle">Discover the weather around the world.</p>
        </header>

        <form id="weather-form">
            <input
                type="text"
                id="city-input"
                placeholder="Enter city name..."
                aria-label="City name"
                required
            >
            <button type="submit" id="search-btn">Search</button>
        </form>

        <p id="status" role="status" aria-live="polite">
            Search for a city to see its weather.
        </p>

        <section id="weather-card" class="weather-card" hidden>
            <div class="weather-heading">
                <div>
                    <p class="eyebrow">CURRENT WEATHER</p>
                    <h2 id="city-name">City</h2>
                    <p id="local-time"></p>
                </div>
                <div class="condition-icon" id="weather-icon">☀️</div>
            </div>

            <div class="temperature">
                <span id="temperature">--</span><span>°C</span>
            </div>
            <p id="condition" class="condition">Weather condition</p>

            <div class="metrics">
                <article class="metric">
                    <span>💧</span>
                    <p>Humidity</p>
                    <h3 id="humidity">--%</h3>
                </article>

                <article class="metric">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <h3 id="wind-speed">-- km/h</h3>
                </article>

                <article class="metric">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <h3 id="feels-like">--°C</h3>
                </article>
            </div>
        </section>

        <footer>
            Weather data provided by
            <a href="https://open-meteo.com/" target="_blank"
               rel="noopener noreferrer">Open-Meteo</a>
        </footer>
    </main>
</body>
</html>
